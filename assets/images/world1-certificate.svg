<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World1 修了証：副業ゼロ・AI未経験から月5万円達成までの道のりを完走したことを証明する">
  <defs>
    <filter id="cert-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#1f2937" rx="14"/>

  <!-- Certificate frame -->
  <g filter="url(#cert-shadow)">
    <rect x="50" y="50" width="900" height="500" rx="14" fill="url(#cert-grad)" stroke="#d97706" stroke-width="6"/>
  </g>
  <rect x="80" y="80" width="840" height="440" rx="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Top decoration -->
  <text x="500" y="135" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🏆</text>

  <!-- Title -->
  <text x="500" y="180" text-anchor="middle" font-size="32" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">World 1 修了証</text>
  <text x="500" y="210" text-anchor="middle" font-size="14" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">— Certificate of Completion —</text>

  <!-- Body text -->
  <text x="500" y="265" text-anchor="middle" font-size="14" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">あなたは「副業ゼロ・AI未経験」から</text>
  <text x="500" y="288" text-anchor="middle" font-size="14" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「Claude Code を使いこなして月5万円を稼ぐ人」へと</text>
  <text x="500" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5つのステージを完走しました</text>

  <!-- Stages completed -->
  <g>
    <rect x="180" y="345" width="120" height="80" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="240" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-1</text>
    <text x="240" y="388" text-anchor="middle" font-size="20" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🛠️</text>
    <text x="240" y="412" text-anchor="middle" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">道具揃え</text>
  </g>
  <g>
    <rect x="320" y="345" width="120" height="80" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="380" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-2</text>
    <text x="380" y="388" text-anchor="middle" font-size="20" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🎯</text>
    <text x="380" y="412" text-anchor="middle" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3ステップ習得</text>
  </g>
  <g>
    <rect x="460" y="345" width="120" height="80" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="520" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-3</text>
    <text x="520" y="388" text-anchor="middle" font-size="20" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📨</text>
    <text x="520" y="412" text-anchor="middle" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">案件取得</text>
  </g>
  <g>
    <rect x="600" y="345" width="120" height="80" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="660" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-4</text>
    <text x="660" y="388" text-anchor="middle" font-size="20" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🤝</text>
    <text x="660" y="412" text-anchor="middle" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">★5納品</text>
  </g>
  <g>
    <rect x="740" y="345" width="120" height="80" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="800" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-5</text>
    <text x="800" y="388" text-anchor="middle" font-size="20" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💰</text>
    <text x="800" y="412" text-anchor="middle" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月5万達成</text>
  </g>

  <!-- Achievement -->
  <text x="500" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🌟 月5万円・達成 🌟</text>

  <!-- Stamp / Seal -->
  <g transform="translate(840, 470) rotate(-15)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">CLEAR</text>
    <text x="0" y="13" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">★★★★★</text>
  </g>

  <!-- Signature -->
  <text x="160" y="495" font-size="11" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">World 1 Curriculum</text>
  <line x1="160" y1="500" x2="280" y2="500" stroke="#7c2d12" stroke-width="1"/>

  <!-- Stage clear text -->
  <text x="500" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ World 2 への扉が開きました</text>
</svg>
