<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="インストール画面：MacのDMGでApplicationsへドラッグ／Windowsインストーラー">
  <defs>
    <filter id="ins-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ins-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="800" height="380" fill="#f3f4f6" rx="14"/>

  <!-- LEFT: Mac DMG -->
  <text x="200" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🍎 Mac の場合</text>

  <g filter="url(#ins-shadow)">
    <rect x="40" y="50" width="320" height="260" rx="10" fill="white" stroke="#d1d5db" stroke-width="1"/>
  </g>
  <rect x="40" y="50" width="320" height="32" rx="10" fill="#f3f4f6"/>
  <rect x="40" y="72" width="320" height="10" fill="#f3f4f6"/>
  <circle cx="58" cy="66" r="5" fill="#ef4444"/>
  <circle cx="74" cy="66" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="66" r="5" fill="#22c55e"/>
  <text x="200" y="71" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Installer</text>

  <!-- Claude.app icon (left) -->
  <g filter="url(#ins-shadow)">
    <rect x="80" y="120" width="80" height="80" rx="18" fill="#ea580c"/>
  </g>
  <text x="120" y="170" text-anchor="middle" font-size="36" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C</text>
  <text x="120" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude.app</text>

  <!-- Drag arrow -->
  <line x1="170" y1="160" x2="240" y2="160" stroke="#ea580c" stroke-width="3" marker-end="url(#ins-arrow)" stroke-dasharray="4,3"/>
  <text x="205" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">ドラッグ</text>

  <!-- Applications folder icon (right) -->
  <g filter="url(#ins-shadow)">
    <rect x="250" y="120" width="80" height="80" rx="14" fill="#3b82f6"/>
  </g>
  <text x="290" y="170" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📁</text>
  <text x="290" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Applications</text>

  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">アプリのアイコンを</text>
  <text x="200" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Applications フォルダにドラッグ</text>

  <!-- RIGHT: Windows installer -->
  <text x="600" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🪟 Windows の場合</text>

  <g filter="url(#ins-shadow)">
    <rect x="440" y="50" width="320" height="260" rx="6" fill="white" stroke="#d1d5db" stroke-width="1"/>
  </g>
  <rect x="440" y="50" width="320" height="28" fill="#0078d4"/>
  <text x="455" y="69" font-size="11" font-weight="600" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Setup</text>
  <text x="746" y="69" text-anchor="end" font-size="14" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">×</text>

  <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Welcome to Claude Setup</text>
  <text x="600" y="150" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">This wizard will install Claude on your computer.</text>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Click Next to continue.</text>

  <!-- Progress bar visual -->
  <rect x="480" y="200" width="240" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="480" y="200" width="200" height="14" rx="3" fill="#0078d4"/>
  <text x="600" y="234" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Installing... 80%</text>

  <!-- Buttons -->
  <rect x="540" y="265" width="60" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="570" y="284" text-anchor="middle" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Back</text>

  <g filter="url(#ins-shadow)">
    <rect x="610" y="265" width="60" height="28" rx="3" fill="#0078d4"/>
  </g>
  <text x="640" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Next</text>

  <rect x="680" y="265" width="60" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="710" y="284" text-anchor="middle" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Cancel</text>

  <!-- Annotation -->
  <line x1="710" y1="250" x2="650" y2="263" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ins-arrow-r)"/>
  <defs>
    <marker id="ins-arrow-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="725" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「Next」を押すだけ</text>

  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">どちらのOSも、難しい選択肢はありません</text>
</svg>
