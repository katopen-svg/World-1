<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="副業のPDCAサイクル：月初の計画、日々の応募・制作、週末の振り返り、翌週の改善で精度を上げる">
  <defs>
    <filter id="pd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="pd-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#f0fdf4" rx="14"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔄 副業のPDCAサイクル — 週次/月次で精度を上げる</text>

  <!-- P: Plan (top-left) -->
  <g filter="url(#pd-shadow)">
    <circle cx="280" cy="180" r="90" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="280" y="155" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📋</text>
  <text x="280" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">P</text>
  <text x="280" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Plan</text>
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">計画（月初）</text>

  <text x="280" y="295" text-anchor="middle" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・今月の目標額（¥XX,000）</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・件数 × 単価で逆算</text>
  <text x="280" y="329" text-anchor="middle" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・新カテゴリ挑戦の有無</text>

  <line x1="370" y1="180" x2="455" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#pd-arrow)"/>

  <!-- D: Do (top-right) -->
  <g filter="url(#pd-shadow)">
    <circle cx="550" cy="180" r="90" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="550" y="155" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚡</text>
  <text x="550" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">D</text>
  <text x="550" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Do</text>
  <text x="550" y="225" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">実行（日々）</text>

  <text x="550" y="295" text-anchor="middle" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・朝5分・夜10分のルーティン</text>
  <text x="550" y="312" text-anchor="middle" font-size="11" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif" fill="#166534">・スプシに応募・採用記録</text>
  <text x="550" y="329" text-anchor="middle" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・★5納品で信頼貯金</text>

  <line x1="640" y1="180" x2="725" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#pd-arrow)"/>

  <!-- C: Check (top-far-right) -->
  <g filter="url(#pd-shadow)">
    <circle cx="820" cy="180" r="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <text x="820" y="155" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📊</text>
  <text x="820" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C</text>
  <text x="820" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Check</text>
  <text x="820" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">振り返り（週末）</text>

  <text x="820" y="295" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・採用率（応募X件/採用Y件）</text>
  <text x="820" y="312" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・平均単価（先週との比較）</text>
  <text x="820" y="329" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・落選傾向の分析</text>

  <!-- Loop arrow from C back to P (curving below) -->
  <path d="M 820 270 Q 820 410 550 410 L 280 410 Q 280 410 280 270" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="6,4" marker-end="url(#pd-arrow)"/>
  <text x="550" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">A: Action（翌週の改善）</text>
  <text x="550" y="405" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・基準アップデート（提案中5人以下に絞る等）</text>
  <text x="550" y="423" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・テンプレ修正・新カテゴリ試行</text>

  <!-- Footer -->
  <text x="550" y="465" text-anchor="middle" font-size="11" fill="#15803d" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">毎週このループで改善 → 採用率と単価が右肩上がりになる</text>
</svg>
