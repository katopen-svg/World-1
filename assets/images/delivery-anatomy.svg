<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" preserveAspectRatio="xMidYMid meet" role="img" aria-label="★5を引き寄せる納品の3要素：セルフチェック済みの品質、価値を伝えるカバー文、整ったファイル">
  <defs>
    <filter id="da-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="460" fill="#f0fdf4" rx="14"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📦 ★5を引き寄せる納品の3要素</text>
  <text x="550" y="64" text-anchor="middle" font-size="12" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「ファイルを送るだけ」の納品から、「この人にまた頼みたい」納品へ</text>

  <!-- Element 1: 品質（セルフチェック） -->
  <g filter="url(#da-shadow)">
    <rect x="40" y="100" width="320" height="280" rx="14" fill="white" stroke="#22c55e" stroke-width="3"/>
  </g>
  <rect x="40" y="100" width="320" height="44" rx="14" fill="#dcfce7"/>
  <rect x="40" y="125" width="320" height="19" fill="#dcfce7"/>
  <text x="200" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">① 品質（セルフチェック済み）</text>

  <text x="200" y="195" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✅</text>

  <text x="60" y="240" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 件数の数え直し（重複チェック）</text>
  <text x="60" y="262" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 取得項目に空欄がないか</text>
  <text x="60" y="284" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ URLが全部開けるか（最低5件抜き打ち）</text>
  <text x="60" y="306" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ マニュアルの除外条件を守ってるか</text>
  <text x="60" y="328" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ ファイル名が指定通りか</text>

  <text x="200" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ ミスのない安心感を提供</text>

  <!-- Element 2: カバー文 -->
  <g filter="url(#da-shadow)">
    <rect x="380" y="100" width="320" height="280" rx="14" fill="white" stroke="#22c55e" stroke-width="3"/>
  </g>
  <rect x="380" y="100" width="320" height="44" rx="14" fill="#dcfce7"/>
  <rect x="380" y="125" width="320" height="19" fill="#dcfce7"/>
  <text x="540" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">② カバー文（価値を伝える）</text>

  <text x="540" y="195" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📝</text>

  <text x="400" y="240" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 件数・有効件数の明示</text>
  <text x="400" y="262" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 弾いた案件の件数とその理由</text>
  <text x="400" y="284" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 自分で気付いた改善ポイント1〜2件</text>
  <text x="400" y="306" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 確認をお願いしたい点</text>
  <text x="400" y="328" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 「次回もぜひ」のひと言</text>

  <text x="540" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 「ちゃんとやってくれた」が伝わる</text>

  <!-- Element 3: 整ったファイル -->
  <g filter="url(#da-shadow)">
    <rect x="720" y="100" width="320" height="280" rx="14" fill="white" stroke="#22c55e" stroke-width="3"/>
  </g>
  <rect x="720" y="100" width="320" height="44" rx="14" fill="#dcfce7"/>
  <rect x="720" y="125" width="320" height="19" fill="#dcfce7"/>
  <text x="880" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">③ 整ったファイル（見やすさ）</text>

  <text x="880" y="195" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📊</text>

  <text x="740" y="240" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ ヘッダー行を太字 + 背景色で見やすく</text>
  <text x="740" y="262" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 列幅が自動調整されてる</text>
  <text x="740" y="284" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ URLはハイパーリンク化</text>
  <text x="740" y="306" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ ファイル名: <tspan font-family="monospace">案件名_納品_v1.csv</tspan></text>
  <text x="740" y="328" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 不要な余白行・空列を削除</text>

  <text x="880" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 受け取ってすぐ使える</text>

  <!-- Footer caption -->
  <text x="550" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">①品質 × ②カバー文 × ③整ったファイル ＝ ★5評価＆リピート発注</text>
</svg>
