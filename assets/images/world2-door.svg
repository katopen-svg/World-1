<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="月5万円達成までの道筋：現在地（月3万・w1-4卒業）から3つの動き（リピート育成・カテゴリ広げ・振り返り改善）を経て、月5万達成、その先のWorld2の扉へ">
  <defs>
    <filter id="w2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="w2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="w2-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#faf5ff" rx="14"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🚪 World1 卒業の扉 — 月5万達成までの道筋</text>

  <!-- Section labels -->
  <text x="135" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">━ 現在地 ━</text>
  <text x="600" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">━ w1-5 で身につける3つの動き ━</text>
  <text x="1060" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">━ ゴール ━</text>

  <!-- ============== LEFT: 現在地（月3万） ============== -->

  <g filter="url(#w2-shadow)">
    <rect x="40" y="160" width="190" height="160" rx="14" fill="white" stroke="#a78bfa" stroke-width="3"/>
  </g>
  <text x="135" y="200" text-anchor="middle" font-size="38" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📍</text>
  <text x="135" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月3万</text>
  <text x="135" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-4 卒業時</text>
  <text x="135" y="278" text-anchor="middle" font-size="11" fill="#7c3aed" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">★5納品済み</text>
  <text x="135" y="296" text-anchor="middle" font-size="11" fill="#7c3aed" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">リピート1件 + 新規数件</text>

  <!-- Arrow from 月3万 to middle -->
  <line x1="240" y1="240" x2="305" y2="240" stroke="#0ea5e9" stroke-width="3" marker-end="url(#w2-arrow)"/>

  <!-- ============== MIDDLE: 3つの動き ============== -->

  <!-- Path 1: リピート育成 -->
  <g filter="url(#w2-shadow)">
    <rect x="320" y="115" width="220" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <text x="345" y="160" font-size="28" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁</text>
  <text x="385" y="148" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">リピート育成</text>
  <text x="385" y="167" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">単価UP・継続案件化</text>
  <text x="385" y="183" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5-2 で習う</text>

  <!-- Path 2: カテゴリ広げ -->
  <g filter="url(#w2-shadow)">
    <rect x="320" y="205" width="220" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
  <text x="345" y="250" font-size="28" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🌐</text>
  <text x="385" y="238" font-size="13" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">カテゴリ広げ</text>
  <text x="385" y="257" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">新ジャンル・新天地</text>
  <text x="385" y="273" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5-3 で習う</text>

  <!-- Path 3: 振り返り改善 -->
  <g filter="url(#w2-shadow)">
    <rect x="320" y="295" width="220" height="80" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <text x="345" y="340" font-size="28" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔄</text>
  <text x="385" y="328" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">振り返り改善</text>
  <text x="385" y="347" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">PDCA で精度UP</text>
  <text x="385" y="363" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5-4 で習う</text>

  <!-- Pre-step: 5-1 月5万分解 -->
  <text x="650" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">↑↑ 5-1 で「月5万を逆算」して目標を数字に分解</text>

  <!-- Convergence arrows from 3 paths to 月5万 -->
  <line x1="545" y1="155" x2="800" y2="220" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#w2-arrow)"/>
  <line x1="545" y1="245" x2="800" y2="245" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#w2-arrow)"/>
  <line x1="545" y1="335" x2="800" y2="270" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#w2-arrow)"/>

  <!-- ============== RIGHT: 月5万達成 → World2 ============== -->

  <!-- 月5万 Achievement Badge -->
  <g filter="url(#w2-shadow)">
    <circle cx="845" cy="245" r="60" fill="url(#w2-grad)" stroke="#d97706" stroke-width="4"/>
  </g>
  <text x="845" y="240" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💰</text>
  <text x="845" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月5万</text>
  <text x="845" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">達成 = World1卒業</text>

  <!-- Arrow to World2 door -->
  <line x1="908" y1="245" x2="970" y2="245" stroke="#7c3aed" stroke-width="3" marker-end="url(#w2-arrow)"/>

  <!-- World2 Door -->
  <g filter="url(#w2-shadow)">
    <rect x="985" y="155" width="150" height="200" rx="8" fill="#4c1d95"/>
  </g>
  <rect x="995" y="165" width="130" height="180" rx="4" fill="#5b21b6"/>
  <!-- Door handle -->
  <circle cx="1110" cy="255" r="4" fill="#fbbf24"/>
  <!-- World2 label inside door -->
  <text x="1060" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#fbbf24" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🌟</text>
  <text x="1060" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">World</text>
  <text x="1060" y="305" text-anchor="middle" font-size="32" font-weight="700" fill="#fbbf24" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">2</text>

  <text x="1060" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月10万・30万へ</text>
  <text x="1060" y="396" text-anchor="middle" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">次のステージ</text>

  <!-- Footer caption -->
  <text x="600" y="450" text-anchor="middle" font-size="12" fill="#5b21b6" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5-1で目標を数字に分解 → 5-2/5-3/5-4で動きを習慣化 → 5-5で月5万達成 → World2へ</text>
</svg>
