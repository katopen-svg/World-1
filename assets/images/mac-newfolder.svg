<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mac の Finder で右クリック→新規フォルダ を選ぶ画面イメージ">
  <defs>
    <filter id="mac-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景（デスクトップっぽい青） -->
  <rect width="600" height="360" fill="#dbeafe" rx="12"/>

  <!-- Finder ウィンドウ -->
  <g filter="url(#mac-shadow)">
    <rect x="40" y="40" width="520" height="280" rx="10" fill="#f5f5f7"/>
  </g>

  <!-- タイトルバー -->
  <rect x="40" y="40" width="520" height="36" rx="10" fill="#e5e5e7"/>
  <rect x="40" y="62" width="520" height="14" fill="#e5e5e7"/>
  <!-- 信号機 -->
  <circle cx="60" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="78" cy="58" r="6" fill="#febc2e"/>
  <circle cx="96" cy="58" r="6" fill="#28c840"/>
  <!-- パンくず -->
  <text x="160" y="62" font-size="12" fill="#1f2937" font-weight="600" font-family="system-ui, -apple-system, sans-serif">🖥️ デスクトップ</text>

  <!-- ツールバー -->
  <rect x="40" y="76" width="520" height="32" fill="#f5f5f7"/>
  <text x="60" y="96" font-size="14" fill="#9ca3af">◀</text>
  <text x="80" y="96" font-size="14" fill="#9ca3af">▶</text>
  <text x="500" y="96" font-size="13" fill="#9ca3af">⊞</text>

  <!-- ファイル一覧エリア -->
  <rect x="40" y="108" width="520" height="212" fill="white"/>

  <!-- 右クリックメニュー -->
  <g filter="url(#mac-shadow)">
    <rect x="180" y="140" width="240" height="160" rx="8" fill="white" stroke="#d1d5db"/>
  </g>
  <!-- メニュー項目 -->
  <text x="200" y="170" font-size="13" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">表示</text>
  <text x="200" y="195" font-size="13" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">並べ替え</text>
  <line x1="190" y1="208" x2="410" y2="208" stroke="#e5e7eb"/>
  <!-- ハイライト：新規フォルダ -->
  <rect x="184" y="216" width="232" height="28" rx="4" fill="#3b82f6"/>
  <text x="200" y="235" font-size="13" fill="white" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">新規フォルダ</text>
  <text x="380" y="235" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">⇧⌘N</text>
  <line x1="190" y1="252" x2="410" y2="252" stroke="#e5e7eb"/>
  <text x="200" y="272" font-size="13" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">情報を見る</text>

  <!-- カーソル -->
  <text x="240" y="245" font-size="22" fill="#1f2937">▸</text>

  <!-- 注釈 -->
  <text x="300" y="345" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🍎 Mac：右クリックして「新規フォルダ」を選ぶ</text>
</svg>
