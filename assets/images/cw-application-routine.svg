<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="1日の応募ルーティン：朝5分の新着案件チェック、昼の採用通知への即返信、夜10分の5件応募">
  <defs>
    <filter id="rt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rt-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1100" height="440" fill="#f0f9ff" rx="14"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏰ 1日の応募ルーティン — 合計15〜20分で回る</text>

  <!-- ============== 朝（5分・検索） ============== -->

  <g filter="url(#rt-shadow)">
    <rect x="50" y="90" width="300" height="280" rx="14" fill="white" stroke="#fbbf24" stroke-width="3"/>
  </g>
  <rect x="50" y="90" width="300" height="50" rx="14" fill="#fef3c7"/>
  <rect x="50" y="120" width="300" height="20" fill="#fef3c7"/>
  <text x="200" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🌅 朝（5分）</text>

  <text x="200" y="190" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔍</text>

  <text x="200" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">新着案件をチェック</text>

  <text x="80" y="262" font-size="11" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ ブックマークから検索を開く</text>
  <text x="80" y="282" font-size="11" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 新着順 × フィルタ済み</text>
  <text x="80" y="302" font-size="11" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 候補3〜5件をスプシに記録</text>
  <text x="80" y="322" font-size="11" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 応募はまだしない（夜にまとめて）</text>

  <text x="200" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 候補リストを夜まで温める</text>

  <!-- Arrow 1 -->
  <line x1="360" y1="230" x2="395" y2="230" stroke="#0ea5e9" stroke-width="3" marker-end="url(#rt-arrow)"/>

  <!-- ============== 昼（随時・採用返信） ============== -->

  <g filter="url(#rt-shadow)">
    <rect x="400" y="90" width="300" height="280" rx="14" fill="white" stroke="#22c55e" stroke-width="3"/>
  </g>
  <rect x="400" y="90" width="300" height="50" rx="14" fill="#dcfce7"/>
  <rect x="400" y="120" width="300" height="20" fill="#dcfce7"/>
  <text x="550" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">☀️ 昼（随時）</text>

  <text x="550" y="190" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📨</text>

  <text x="550" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">採用通知が来たら即返信</text>

  <text x="430" y="262" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 通知メールをスマホで確認</text>
  <text x="430" y="282" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ <tspan font-weight="700">30分以内</tspan>に返信が信頼を作る</text>
  <text x="430" y="302" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 受領メッセージのテンプレ流用</text>
  <text x="430" y="322" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ スプシで「採用」状態に更新</text>

  <text x="550" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ そのまま w1-2 の型で制作開始</text>

  <!-- Arrow 2 -->
  <line x1="710" y1="230" x2="745" y2="230" stroke="#0ea5e9" stroke-width="3" marker-end="url(#rt-arrow)"/>

  <!-- ============== 夜（10分・応募） ============== -->

  <g filter="url(#rt-shadow)">
    <rect x="750" y="90" width="300" height="280" rx="14" fill="white" stroke="#6366f1" stroke-width="3"/>
  </g>
  <rect x="750" y="90" width="300" height="50" rx="14" fill="#e0e7ff"/>
  <rect x="750" y="120" width="300" height="20" fill="#e0e7ff"/>
  <text x="900" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🌙 夜（10分）</text>

  <text x="900" y="190" text-anchor="middle" font-size="48" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📝</text>

  <text x="900" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">候補3〜5件にまとめて応募</text>

  <text x="780" y="262" font-size="11" fill="#3730a3" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 朝のリストを開く</text>
  <text x="780" y="282" font-size="11" fill="#3730a3" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ <tspan font-weight="700">3-3 のテンプレ</tspan>で提案文を生成</text>
  <text x="780" y="302" font-size="11" fill="#3730a3" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 微調整 → 応募ボタン手動クリック</text>
  <text x="780" y="322" font-size="11" fill="#3730a3" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ スプシに「応募中」で記録</text>

  <text x="900" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#312e81" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 翌朝、新着チェックへ戻る（ループ）</text>

  <!-- Loop arrow back to morning -->
  <path d="M 750 360 Q 550 410 350 360" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <polygon points="350,360 360,355 360,365" fill="#6366f1"/>
  <text x="550" y="408" text-anchor="middle" font-size="11" fill="#4338ca" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">毎日くり返す（4件落ちて1件採用、を量で乗り越える）</text>
</svg>
