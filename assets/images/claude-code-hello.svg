<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Claude Code Desktopの動作確認画面：「こんにちは」と打つと挨拶が返ってくる">
  <defs>
    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="420" fill="#f3f4f6" rx="14"/>

  <!-- Window frame -->
  <g filter="url(#window-shadow)">
    <rect x="40" y="30" width="620" height="360" rx="10" fill="#1f2937"/>
  </g>

  <!-- Title bar -->
  <rect x="40" y="30" width="620" height="32" rx="10" fill="#111827"/>
  <rect x="40" y="50" width="620" height="12" fill="#111827"/>
  <circle cx="60" cy="46" r="6" fill="#ef4444"/>
  <circle cx="80" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="46" r="6" fill="#22c55e"/>
  <text x="350" y="51" text-anchor="middle" font-size="11" font-weight="600" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Code</text>

  <!-- Greeting bubble (Claude's reply) -->
  <rect x="80" y="90" width="500" height="110" rx="10" fill="#374151"/>
  <circle cx="100" cy="115" r="12" fill="#ea580c"/>
  <text x="100" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C</text>
  <text x="120" y="119" font-size="11" font-weight="700" fill="#e5e7eb" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude</text>
  <text x="100" y="145" font-size="12" fill="#f3f4f6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">こんにちは！何をお手伝いしましょうか？</text>
  <text x="100" y="168" font-size="12" fill="#f3f4f6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">気軽に話しかけてくださいね。</text>
  <text x="100" y="188" font-size="11" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">フォルダを開けば、その中身を見て作業を手伝えます。</text>

  <!-- User bubble -->
  <rect x="380" y="220" width="200" height="40" rx="10" fill="#3b82f6"/>
  <text x="480" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">こんにちは</text>

  <!-- Folder pills row -->
  <rect x="80" y="290" width="80" height="28" rx="6" fill="#374151"/>
  <text x="120" y="308" text-anchor="middle" font-size="11" fill="#e5e7eb" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📁 ローカル</text>

  <!-- Input box -->
  <rect x="80" y="334" width="500" height="40" rx="8" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="100" y="358" font-size="12" fill="#9ca3af" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">何でも聞いてください...</text>
  <text x="565" y="358" text-anchor="end" font-size="14" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">↵</text>

  <!-- Mascot -->
  <text x="610" y="318" font-size="22" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🦊</text>

  <!-- Caption -->
  <text x="350" y="408" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「こんにちは」と打って返事が来たらインストール完了！</text>
</svg>
