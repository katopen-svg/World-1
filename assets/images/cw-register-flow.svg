<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="クラウドワークス登録の5ステップ：アカウント作成→本人確認→プロフィール写真→自己紹介文→スキルタグ">
  <defs>
    <filter id="rg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rg-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1100" height="320" fill="#fff7ed" rx="14"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📋 クラウドワークス登録の5ステップ — 35分（+ 本人確認の審査1〜2日）</text>

  <!-- Step 1: アカウント登録 -->
  <g filter="url(#rg-shadow)">
    <rect x="30" y="80" width="190" height="180" rx="12" fill="white" stroke="#fdba74" stroke-width="2"/>
  </g>
  <circle cx="65" cy="115" r="17" fill="#f97316"/>
  <text x="65" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1</text>
  <text x="95" y="121" font-size="13" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">アカウント登録</text>
  <text x="125" y="180" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📧</text>
  <text x="125" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5分</text>
  <text x="125" y="240" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">メアド + パスワード</text>

  <line x1="225" y1="170" x2="248" y2="170" stroke="#f97316" stroke-width="2.5" marker-end="url(#rg-arrow)"/>

  <!-- Step 2: 本人確認 -->
  <g filter="url(#rg-shadow)">
    <rect x="252" y="80" width="190" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <circle cx="287" cy="115" r="17" fill="#d97706"/>
  <text x="287" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">2</text>
  <text x="317" y="121" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">本人確認</text>
  <text x="347" y="180" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🪪</text>
  <text x="347" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10分 + 審査1〜2日</text>
  <text x="347" y="240" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">免許 / マイナカード</text>

  <line x1="447" y1="170" x2="470" y2="170" stroke="#f97316" stroke-width="2.5" marker-end="url(#rg-arrow)"/>

  <!-- Step 3: プロフィール写真 -->
  <g filter="url(#rg-shadow)">
    <rect x="474" y="80" width="190" height="180" rx="12" fill="white" stroke="#fdba74" stroke-width="2"/>
  </g>
  <circle cx="509" cy="115" r="17" fill="#f97316"/>
  <text x="509" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3</text>
  <text x="539" y="121" font-size="13" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">プロフ写真</text>
  <text x="569" y="180" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🖼️</text>
  <text x="569" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5分</text>
  <text x="569" y="240" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">AIで作成 or 自分の写真</text>

  <line x1="669" y1="170" x2="692" y2="170" stroke="#f97316" stroke-width="2.5" marker-end="url(#rg-arrow)"/>

  <!-- Step 4: 自己紹介文 -->
  <g filter="url(#rg-shadow)">
    <rect x="696" y="80" width="190" height="180" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <circle cx="731" cy="115" r="17" fill="#16a34a"/>
  <text x="731" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">4</text>
  <text x="761" y="121" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">自己紹介文</text>
  <text x="791" y="180" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📝</text>
  <text x="791" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10分</text>
  <text x="791" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claudeに書かせる</text>

  <line x1="891" y1="170" x2="914" y2="170" stroke="#f97316" stroke-width="2.5" marker-end="url(#rg-arrow)"/>

  <!-- Step 5: スキルタグ -->
  <g filter="url(#rg-shadow)">
    <rect x="918" y="80" width="160" height="180" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <circle cx="950" cy="115" r="17" fill="#16a34a"/>
  <text x="950" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5</text>
  <text x="980" y="121" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">スキルタグ</text>
  <text x="998" y="180" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🏷️</text>
  <text x="998" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5分</text>
  <text x="998" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claudeに相談</text>

  <!-- Footer caption -->
  <text x="550" y="295" text-anchor="middle" font-size="12" fill="#9a3412" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">緑 = AI活用ステップ｜黄 = 審査時間が必要｜白 = サクッと進む</text>
</svg>
