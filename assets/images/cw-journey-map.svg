<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="クラウドワークス案件の旅路：上段にDay1〜Day7の応募〜採用フロー、下段に制作・納品・評価・月5万円までを並列表示">
  <defs>
    <filter id="cw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cw-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1100" height="540" fill="#f0f9ff" rx="14"/>

  <!-- Title -->
  <text x="550" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🗺️ 副業1ヶ月目のジャーニー — 月5万円までの7ステップ</text>

  <!-- ============== TOP ROW: Day 1 → Day 7 ============== -->

  <!-- Step 1: 登録 -->
  <g filter="url(#cw-shadow)">
    <circle cx="120" cy="160" r="55" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  </g>
  <text x="120" y="157" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">👤</text>
  <text x="120" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">登録</text>
  <text x="120" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 1</text>
  <text x="120" y="258" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5分で完了</text>

  <line x1="180" y1="160" x2="262" y2="160" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 2: 案件探し -->
  <g filter="url(#cw-shadow)">
    <circle cx="320" cy="160" r="55" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  </g>
  <text x="320" y="157" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔍</text>
  <text x="320" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">案件探し</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 1〜3</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">リサーチ系で絞る</text>

  <line x1="380" y1="160" x2="462" y2="160" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 3: 応募×5件 -->
  <g filter="url(#cw-shadow)">
    <circle cx="520" cy="160" r="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="520" y="157" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📝</text>
  <text x="520" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">応募 ×5件</text>
  <text x="520" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 3〜7</text>
  <text x="520" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">最初の4件は落ちる</text>

  <line x1="580" y1="160" x2="657" y2="160" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 4: 採用！ -->
  <g filter="url(#cw-shadow)">
    <circle cx="720" cy="160" r="63" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  </g>
  <text x="720" y="156" text-anchor="middle" font-size="36" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✅</text>
  <text x="720" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">採用！</text>
  <text x="720" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 7（5件目）</text>
  <text x="720" y="264" text-anchor="middle" font-size="11" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥1,500 の初案件</text>

  <!-- Curved connection: 採用 → 制作 (down then left) -->
  <path d="M 720 223 L 720 285 Q 720 305 700 305 L 440 305 Q 420 305 420 325 L 420 327" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#cw-arrow)"/>
  <text x="570" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">同日着手</text>

  <!-- ============== BOTTOM ROW: 制作 → 納品 → 評価 → 月5万 ============== -->

  <!-- Step 5: 制作 -->
  <g filter="url(#cw-shadow)">
    <circle cx="420" cy="385" r="55" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  </g>
  <text x="420" y="382" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🛠️</text>
  <text x="420" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">制作</text>
  <text x="420" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1〜2時間</text>
  <text x="420" y="483" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claudeが大半</text>

  <line x1="480" y1="385" x2="545" y2="385" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 6: 納品 -->
  <g filter="url(#cw-shadow)">
    <circle cx="605" cy="385" r="55" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  </g>
  <text x="605" y="382" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📊</text>
  <text x="605" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">納品</text>
  <text x="605" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 7〜8</text>
  <text x="605" y="483" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">スプシ提出</text>

  <line x1="665" y1="385" x2="730" y2="385" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 7: 評価 -->
  <g filter="url(#cw-shadow)">
    <circle cx="790" cy="385" r="55" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  </g>
  <text x="790" y="382" text-anchor="middle" font-size="32" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐</text>
  <text x="790" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">評価</text>
  <text x="790" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Day 8</text>
  <text x="790" y="483" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">★5を狙う</text>

  <line x1="850" y1="385" x2="912" y2="385" stroke="#0ea5e9" stroke-width="3" marker-end="url(#cw-arrow)"/>

  <!-- Step 8: 月5万 (GOAL) -->
  <g filter="url(#cw-shadow)">
    <circle cx="975" cy="385" r="63" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  </g>
  <text x="975" y="382" text-anchor="middle" font-size="36" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💰</text>
  <text x="975" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月5万</text>
  <text x="975" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Month 1</text>
  <text x="975" y="488" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">件数増×単価UP</text>

  <!-- GOAL banner under 月5万 -->
  <g filter="url(#cw-shadow)">
    <rect x="895" y="503" width="160" height="28" rx="14" fill="#d97706"/>
  </g>
  <text x="975" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🏁 ステージクリア！</text>

  <!-- Footer caption (left side) -->
  <text x="320" y="520" text-anchor="middle" font-size="11" fill="#0369a1" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Aさんの実例：5件目で初採用 ¥1,500 → 月末は単価¥3,000〜6,000の案件もこなせるように</text>
</svg>
