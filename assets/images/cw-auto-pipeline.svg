<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" role="img" aria-label="応募の完全自動化パイプライン：検索→案件評価→提案文生成→応募フォーム入力までをClaude Codeに任せる4ステージ">
  <defs>
    <filter id="ap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ap-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#faf5ff" rx="14"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚙️ 応募の完全自動化パイプライン — Claude Code が4ステージを実行</text>

  <!-- ============== Stage 1: 検索 ============== -->

  <g filter="url(#ap-shadow)">
    <rect x="40" y="100" width="240" height="240" rx="12" fill="white" stroke="#a78bfa" stroke-width="2.5"/>
  </g>
  <rect x="40" y="100" width="240" height="36" rx="12" fill="#ede9fe"/>
  <rect x="40" y="120" width="240" height="16" fill="#ede9fe"/>
  <text x="160" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">① 検索</text>

  <text x="160" y="190" text-anchor="middle" font-size="42" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔍</text>

  <text x="160" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">候補URL一覧を取得</text>

  <text x="60" y="252" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">入力：検索条件</text>
  <text x="60" y="269" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  category=データ収集</text>
  <text x="60" y="284" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  reward&gt;=¥1,500</text>
  <text x="60" y="299" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  sort=新着順</text>

  <text x="60" y="324" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">出力：URL × 5〜10件</text>

  <line x1="285" y1="220" x2="320" y2="220" stroke="#7c3aed" stroke-width="3" marker-end="url(#ap-arrow)"/>

  <!-- ============== Stage 2: レベル感判定 ============== -->

  <g filter="url(#ap-shadow)">
    <rect x="325" y="100" width="240" height="240" rx="12" fill="white" stroke="#a78bfa" stroke-width="2.5"/>
  </g>
  <rect x="325" y="100" width="240" height="36" rx="12" fill="#ede9fe"/>
  <rect x="325" y="120" width="240" height="16" fill="#ede9fe"/>
  <text x="445" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">② レベル感判定</text>

  <text x="445" y="190" text-anchor="middle" font-size="42" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚖️</text>

  <text x="445" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">合う/合わない を仕分け</text>

  <text x="345" y="252" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">入力：案件本文（取得）</text>
  <text x="345" y="269" font-size="10" fill="#16a34a" font-family="system-ui, -apple-system, monospace">  ✓ 件数100件前後 → OK</text>
  <text x="345" y="284" font-size="10" fill="#16a34a" font-family="system-ui, -apple-system, monospace">  ✓ ★4.5以上 → OK</text>
  <text x="345" y="299" font-size="10" fill="#dc2626" font-family="system-ui, -apple-system, monospace">  ✗ Zoom面談要求 → NG</text>

  <text x="345" y="324" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">出力：合う案件のみ通過</text>

  <line x1="570" y1="220" x2="605" y2="220" stroke="#7c3aed" stroke-width="3" marker-end="url(#ap-arrow)"/>

  <!-- ============== Stage 3: 提案文生成 ============== -->

  <g filter="url(#ap-shadow)">
    <rect x="610" y="100" width="240" height="240" rx="12" fill="white" stroke="#a78bfa" stroke-width="2.5"/>
  </g>
  <rect x="610" y="100" width="240" height="36" rx="12" fill="#ede9fe"/>
  <rect x="610" y="120" width="240" height="16" fill="#ede9fe"/>
  <text x="730" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">③ 提案文生成</text>

  <text x="730" y="190" text-anchor="middle" font-size="42" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✍️</text>

  <text x="730" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">テンプレ × 案件で量産</text>

  <text x="630" y="252" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">入力：3-3 のテンプレ</text>
  <text x="630" y="269" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  + 案件本文（自動差込）</text>

  <text x="630" y="294" font-size="11" fill="#5b21b6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">出力：200〜400字 × N件</text>
  <text x="630" y="311" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  proposal_001.md</text>
  <text x="630" y="326" font-size="10" fill="#7c3aed" font-family="system-ui, -apple-system, monospace">  proposal_002.md</text>

  <line x1="855" y1="220" x2="890" y2="220" stroke="#7c3aed" stroke-width="3" marker-end="url(#ap-arrow)"/>

  <!-- ============== Stage 4: 応募フォーム入力 ============== -->

  <g filter="url(#ap-shadow)">
    <rect x="895" y="100" width="260" height="240" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <rect x="895" y="100" width="260" height="36" rx="12" fill="#fde68a"/>
  <rect x="895" y="120" width="260" height="16" fill="#fde68a"/>
  <text x="1025" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">④ 応募フォーム入力</text>

  <text x="1025" y="190" text-anchor="middle" font-size="42" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📨</text>

  <text x="1025" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">フォーム自動入力（半自動）</text>

  <text x="915" y="252" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">入力：提案文 + 案件URL</text>

  <text x="915" y="278" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">処理：</text>
  <text x="915" y="294" font-size="10" fill="#b45309" font-family="system-ui, -apple-system, monospace">  ・応募ページを開く</text>
  <text x="915" y="309" font-size="10" fill="#b45309" font-family="system-ui, -apple-system, monospace">  ・本文をペースト</text>
  <text x="915" y="324" font-size="10" fill="#dc2626" font-weight="700" font-family="system-ui, -apple-system, monospace">  ・送信ボタンは人間が押す</text>

  <!-- Footer warning -->
  <g filter="url(#ap-shadow)">
    <rect x="40" y="365" width="1115" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="60" y="392" font-size="13" font-weight="700" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚠️ 倫理ルール：</text>
  <text x="180" y="392" font-size="12" fill="#991b1b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1日3〜5件まで・質を下げない・最終送信は人間がクリック・規約を必ず確認</text>
  <text x="60" y="408" font-size="11" fill="#991b1b" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">量産荒らしは逆効果。プロフィール評価が傷つくと、次の応募の通過率が下がる。</text>
</svg>
