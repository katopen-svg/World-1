<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="月収の階段：1万円から3万円、5万円へ。一段ずつ積み上げる">
  <defs>
    <linearGradient id="bg-stairs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <filter id="soft-stairs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="240" fill="url(#bg-stairs)" rx="12"/>

  <!-- 装飾 sparkle -->
  <text x="50" y="40" font-size="14" opacity="0.3" font-family="serif">✦</text>
  <text x="540" y="60" font-size="14" opacity="0.3" font-family="serif">✦</text>

  <!-- 上昇矢印（背景に薄く） -->
  <path d="M 80 200 L 540 60" stroke="#d97706" stroke-width="2" stroke-dasharray="3 5" opacity="0.25" stroke-linecap="round"/>

  <!-- ━━━ 1段目: 月1万 ━━━ -->
  <g filter="url(#soft-stairs)">
    <rect x="80" y="160" width="130" height="50" rx="8" fill="#10b981"/>
  </g>
  <text x="145" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif">月1万</text>
  <text x="145" y="232" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">最初の一歩</text>

  <!-- ━━━ 2段目: 月3万 ━━━ -->
  <g filter="url(#soft-stairs)">
    <rect x="240" y="120" width="130" height="90" rx="8" fill="#3b82f6"/>
  </g>
  <text x="305" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif">月3万</text>
  <text x="305" y="232" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">壁を超える</text>

  <!-- ━━━ 3段目: 月5万 ━━━ -->
  <g filter="url(#soft-stairs)">
    <rect x="400" y="80" width="130" height="130" rx="8" fill="#f59e0b"/>
  </g>
  <text x="465" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="white" font-family="system-ui, -apple-system, sans-serif">月5万</text>
  <text x="465" y="232" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">再現性のある収入</text>

  <!-- トロフィー（最上段の上） -->
  <text x="465" y="65" text-anchor="middle" font-size="32">🏆</text>
</svg>
