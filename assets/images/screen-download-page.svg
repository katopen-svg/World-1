<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="claude.ai/download のダウンロードページ：中央にClaudeロゴと「Download for Mac/Windows」ボタン">
  <defs>
    <filter id="dl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="380" fill="#f3f4f6" rx="14"/>

  <!-- Browser window -->
  <g filter="url(#dl-shadow)">
    <rect x="40" y="30" width="620" height="320" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <!-- Title bar (browser chrome) -->
  <rect x="40" y="30" width="620" height="44" rx="10" fill="#f9fafb"/>
  <rect x="40" y="60" width="620" height="14" fill="#f9fafb"/>
  <line x1="40" y1="74" x2="660" y2="74" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="60" cy="52" r="6" fill="#ef4444"/>
  <circle cx="80" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="52" r="6" fill="#22c55e"/>

  <!-- URL bar -->
  <rect x="140" y="42" width="480" height="22" rx="11" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="155" y="58" font-size="11" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔒</text>
  <text x="175" y="58" font-size="12" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, monospace">claude.ai/download</text>

  <!-- Page hero content -->
  <text x="350" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude</text>
  <text x="350" y="170" text-anchor="middle" font-size="14" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">あなたの相棒AIをデスクトップで</text>

  <!-- Big download button -->
  <g filter="url(#dl-shadow)">
    <rect x="225" y="200" width="250" height="56" rx="28" fill="#ea580c"/>
  </g>
  <text x="350" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⬇️  Download for Mac</text>

  <!-- Sub note -->
  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">macOS 12+ / Windows 11+ に対応</text>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Windowsで開いた場合は自動で Windows 版が表示されます</text>

  <!-- Annotation arrow pointing to button -->
  <path d="M 540 230 Q 510 230 488 230" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#dl-arrow)"/>
  <defs>
    <marker id="dl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="555" y="225" font-size="11" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">これを押す</text>

  <!-- Caption -->
  <text x="350" y="370" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">ダウンロードページ：ボタンを1回押せばインストーラーが降ってきます</text>
</svg>
