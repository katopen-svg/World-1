<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="質問の送り方の比較：バラバラに送ると相手が疲れる、まとめて送ると喜ばれる">
  <defs>
    <filter id="qs-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="480" fill="#f9fafb" rx="14"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📨 質問の送り方が、信頼を作る or 削る</text>

  <!-- ============== LEFT: バラバラ質問 ============== -->

  <g filter="url(#qs-shadow)">
    <rect x="40" y="65" width="500" height="40" rx="8" fill="#dc2626"/>
  </g>
  <text x="290" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">❌ NGパターン：バラバラ質問</text>

  <g filter="url(#qs-shadow)">
    <rect x="40" y="115" width="500" height="320" rx="10" fill="white" stroke="#dc2626" stroke-width="2"/>
  </g>

  <!-- Chat bubbles (chronological pile-up) -->
  <text x="60" y="140" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10:15</text>
  <rect x="60" y="146" width="280" height="32" rx="8" fill="#fef2f2"/>
  <text x="75" y="167" font-size="11" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">取得項目について確認したいです</text>

  <text x="60" y="194" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10:32</text>
  <rect x="60" y="200" width="320" height="32" rx="8" fill="#fef2f2"/>
  <text x="75" y="221" font-size="11" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">あ、もう一つ。納品形式は？</text>

  <text x="60" y="248" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">11:48</text>
  <rect x="60" y="254" width="370" height="32" rx="8" fill="#fef2f2"/>
  <text x="75" y="275" font-size="11" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">すみません、重複処理どうすれば…</text>

  <text x="60" y="302" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">14:23</text>
  <rect x="60" y="308" width="290" height="32" rx="8" fill="#fef2f2"/>
  <text x="75" y="329" font-size="11" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">あと例外パターンですが…</text>

  <text x="60" y="356" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">15:50</text>
  <rect x="60" y="362" width="340" height="32" rx="8" fill="#fef2f2"/>
  <text x="75" y="383" font-size="11" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">最後の質問なのですが…</text>

  <!-- Client face -->
  <text x="470" y="270" text-anchor="middle" font-size="50" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😣</text>
  <text x="470" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「またか…」</text>

  <text x="290" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚠️ 相手の集中が切れる、毎回返事の負担</text>

  <!-- ============== RIGHT: まとめ質問 ============== -->

  <g filter="url(#qs-shadow)">
    <rect x="560" y="65" width="500" height="40" rx="8" fill="#22c55e"/>
  </g>
  <text x="810" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✅ OKパターン：まとめ質問</text>

  <g filter="url(#qs-shadow)">
    <rect x="560" y="115" width="500" height="320" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
  </g>

  <text x="580" y="140" font-size="10" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10:30</text>

  <rect x="580" y="146" width="460" height="240" rx="8" fill="#f0fdf4"/>
  <text x="595" y="166" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">確認したい点をまとめてお送りします。</text>

  <rect x="595" y="178" width="40" height="16" rx="3" fill="#dc2626"/>
  <text x="615" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">緊急</text>
  <text x="645" y="190" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">① 取得項目の優先順位（1〜3）</text>

  <rect x="595" y="206" width="40" height="16" rx="3" fill="#f59e0b"/>
  <text x="615" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">通常</text>
  <text x="645" y="218" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">② 納品形式（CSV / スプシ どちら？）</text>

  <rect x="595" y="234" width="40" height="16" rx="3" fill="#f59e0b"/>
  <text x="615" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">通常</text>
  <text x="645" y="246" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">③ 重複時の扱い（最新を残す？）</text>

  <rect x="595" y="262" width="40" height="16" rx="3" fill="#3b82f6"/>
  <text x="615" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">補足</text>
  <text x="645" y="274" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">④ 例外パターンへの対応方針</text>

  <rect x="595" y="290" width="40" height="16" rx="3" fill="#3b82f6"/>
  <text x="615" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">補足</text>
  <text x="645" y="302" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⑤ 進捗報告の頻度（推奨頻度を提示）</text>

  <text x="595" y="332" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">①〜③だけ確認できれば着手できます。</text>
  <text x="595" y="350" font-size="11" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">④⑤はお時間ある時で結構です。</text>
  <text x="595" y="372" font-size="11" font-weight="700" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">よろしくお願いいたします。</text>

  <!-- Client face -->
  <text x="990" y="220" text-anchor="middle" font-size="50" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😊</text>
  <text x="990" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「整理されてる！」</text>

  <text x="810" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 1回で完結、優先度明確、返事も書きやすい</text>

  <!-- Footer -->
  <text x="550" y="465" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">同じ5つの質問でも、送り方で印象は真逆になる</text>
</svg>
