<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="本番フェーズの会話例：方向OKだから全部頼む→Claudeが200件取得→完了URLが返ってくる">
  <defs>
    <radialGradient id="claude-orange-3p" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <filter id="bubble-shadow-3p" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="360" fill="#f7f6f3" rx="14"/>

  <!-- タイトル -->
  <text x="400" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">本番フェーズの会話イメージ</text>

  <!-- ━━━ 吹き出し1: あなた（本番GO） ━━━ -->
  <g filter="url(#bubble-shadow-3p)">
    <rect x="280" y="56" width="490" height="62" rx="22" fill="#3b82f6"/>
  </g>
  <text x="305" y="86" font-size="13" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">方向OK！</text>
  <text x="305" y="106" font-size="13" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">全部やって、200件分頼む</text>

  <!-- ━━━ 吹き出し2: Claude（受付） ━━━ -->
  <g filter="url(#bubble-shadow-3p)">
    <circle cx="60" cy="170" r="22" fill="url(#claude-orange-3p)"/>
  </g>
  <text x="60" y="179" text-anchor="middle" font-size="18">💻</text>

  <g filter="url(#bubble-shadow-3p)">
    <rect x="92" y="146" width="450" height="60" rx="22" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <text x="116" y="174" font-size="13" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">了解です！200件取ってきます。</text>
  <text x="116" y="194" font-size="13" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">10分くらい時間ください</text>

  <!-- ━━━ 吹き出し3: Claude（完了通知） ━━━ -->
  <g filter="url(#bubble-shadow-3p)">
    <circle cx="60" cy="290" r="22" fill="url(#claude-orange-3p)"/>
  </g>
  <text x="60" y="299" text-anchor="middle" font-size="18">💻</text>

  <g filter="url(#bubble-shadow-3p)">
    <rect x="92" y="244" width="490" height="100" rx="20" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="116" y="270" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 完了！200件できました（10分23秒）</text>

  <!-- スプシリンクボタン風 -->
  <rect x="116" y="285" width="250" height="32" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="128" y="306" font-size="12" fill="#065f46" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📊 商品リスト.gsheet を開く</text>
  <text x="116" y="335" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">URLをクライアントに送れば納品完了です</text>
</svg>
