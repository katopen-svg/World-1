<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="返信時間とクライアントの信頼度の関係：30分以内なら★5・最高印象、当日中なら★3・普通、翌日なら★2・不安、2日以上なら★1・候補から外れる">
  <defs>
    <filter id="rt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rt-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#84cc16"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="380" fill="#fffbeb" rx="14"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏰ 返信時間 × クライアントの信頼度</text>
  <text x="550" y="64" text-anchor="middle" font-size="12" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">採用通知が届いた瞬間からスタートする「信頼貯金」のカウント</text>

  <!-- Time gradient bar -->
  <rect x="60" y="90" width="980" height="14" rx="7" fill="url(#rt-gradient)"/>
  <text x="60" y="124" font-size="11" font-weight="600" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚡ すぐ</text>
  <text x="1040" y="124" text-anchor="end" font-size="11" font-weight="600" fill="#b91c1c" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">遅い ⚠️</text>

  <!-- Card 1: 30分以内 -->
  <g filter="url(#rt-shadow)">
    <rect x="60" y="150" width="225" height="200" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="172" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚡ 30分以内</text>
  <text x="172" y="220" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😊</text>
  <text x="172" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐⭐⭐⭐⭐</text>
  <text x="172" y="280" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「動いてくれそう！」</text>
  <text x="172" y="298" text-anchor="middle" font-size="10" fill="#166534" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 一気に信頼貯金が貯まる</text>
  <rect x="80" y="316" width="185" height="22" rx="11" fill="#16a34a"/>
  <text x="172" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🎯 ここを狙う</text>

  <!-- Card 2: 当日中（数時間以内）-->
  <g filter="url(#rt-shadow)">
    <rect x="305" y="150" width="225" height="200" rx="12" fill="white" stroke="#84cc16" stroke-width="2"/>
  </g>
  <text x="417" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#365314" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🕐 当日中</text>
  <text x="417" y="220" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😐</text>
  <text x="417" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#65a30d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐⭐⭐⭐</text>
  <text x="417" y="280" text-anchor="middle" font-size="11" fill="#4d7c0f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「OK、働き者だな」</text>
  <text x="417" y="298" text-anchor="middle" font-size="10" fill="#3f6212" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 許容ライン</text>
  <rect x="325" y="316" width="185" height="22" rx="11" fill="#84cc16"/>
  <text x="417" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">本業忙しい時はここでもOK</text>

  <!-- Card 3: 翌日 -->
  <g filter="url(#rt-shadow)">
    <rect x="550" y="150" width="225" height="200" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="662" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏳ 翌日</text>
  <text x="662" y="220" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😟</text>
  <text x="662" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐⭐⭐</text>
  <text x="662" y="280" text-anchor="middle" font-size="11" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「ちゃんと見てる？」</text>
  <text x="662" y="298" text-anchor="middle" font-size="10" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 不安が芽生え始める</text>
  <rect x="570" y="316" width="185" height="22" rx="11" fill="#f59e0b"/>
  <text x="662" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚠️ 信頼が削られる</text>

  <!-- Card 4: 2日以上 -->
  <g filter="url(#rt-shadow)">
    <rect x="795" y="150" width="245" height="200" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="917" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🚨 2日以上</text>
  <text x="917" y="220" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">😠</text>
  <text x="917" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐⭐</text>
  <text x="917" y="280" text-anchor="middle" font-size="11" fill="#991b1b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「他の人にしようか…」</text>
  <text x="917" y="298" text-anchor="middle" font-size="10" fill="#7f1d1d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→ 採用取り消しもありうる</text>
  <rect x="815" y="316" width="205" height="22" rx="11" fill="#dc2626"/>
  <text x="917" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">❌ 絶対に避ける</text>
</svg>
