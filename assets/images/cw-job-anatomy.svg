<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="クラウドワークス案件カードの解剖図：見るべき6つのポイント（案件文の具体性／報酬と件数／クライアント評価／提案中の人数／マニュアル／納期）">
  <defs>
    <filter id="ja-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ja-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="540" fill="#f3f4f6" rx="14"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔍 案件カードの「ここを見る」6ポイント</text>

  <!-- Job card (centered) -->
  <g filter="url(#ja-shadow)">
    <rect x="280" y="80" width="440" height="290" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  </g>

  <!-- Title (point ①) -->
  <text x="300" y="115" font-size="15" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">楽天市場 キッチン雑貨ショップ100社調査</text>

  <!-- Description -->
  <text x="300" y="142" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">指定カテゴリ内のショップ名・運営会社・公式URL</text>
  <text x="300" y="158" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">を取得していただきます。<tspan font-weight="700" fill="#16a34a">詳細マニュアルあり</tspan>。</text>

  <!-- Reward badge (point ②) -->
  <rect x="300" y="178" width="100" height="28" rx="4" fill="#fef3c7"/>
  <text x="350" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥2,000</text>

  <!-- Volume + deadline -->
  <text x="415" y="197" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📦 100件</text>
  <text x="500" y="197" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📅 5日以内</text>

  <!-- Client info (point ③) -->
  <rect x="300" y="220" width="400" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="312" y="244" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif"><tspan font-weight="700" fill="#16a34a">★ 4.8</tspan>（発注実績 85件）  株式会社サンプルクライアント</text>

  <!-- Applicants (point ④) -->
  <text x="300" y="285" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">👤 提案中: <tspan font-weight="700" fill="#0369a1">8人</tspan></text>

  <!-- Apply button -->
  <rect x="580" y="320" width="120" height="34" rx="6" fill="#f97316"/>
  <text x="640" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">応募する</text>

  <!-- ============== ANNOTATIONS ============== -->

  <!-- ① Title annotation (top-left) -->
  <g>
    <rect x="40" y="90" width="200" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="55" y="110" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">① 案件タイトル</text>
    <text x="55" y="127" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">具体的（カテゴリ・件数）か？</text>
    <text x="55" y="141" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「お小遣い稼ぎ」系はNG</text>
  </g>
  <line x1="240" y1="115" x2="295" y2="115" stroke="#22c55e" stroke-width="2" marker-end="url(#ja-arrow)"/>

  <!-- ② Reward annotation (top-right) -->
  <g>
    <rect x="760" y="170" width="210" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="775" y="190" font-size="11" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">② 報酬・件数・納期</text>
    <text x="775" y="207" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">100件で¥1,500〜3,000なら</text>
    <text x="775" y="221" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">レベル感ちょうどいい</text>
  </g>
  <line x1="755" y1="195" x2="715" y2="195" stroke="#f59e0b" stroke-width="2" marker-end="url(#ja-arrow)"/>

  <!-- ③ Client rating annotation (bottom-left) -->
  <g>
    <rect x="40" y="220" width="220" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="55" y="240" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">③ クライアント評価</text>
    <text x="55" y="256" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">★4.5以上 + 発注10件以上</text>
    <text x="55" y="270" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">が安心ライン</text>
  </g>
  <line x1="260" y1="245" x2="295" y2="240" stroke="#22c55e" stroke-width="2" marker-end="url(#ja-arrow)"/>

  <!-- ④ Applicants annotation (bottom-right) -->
  <g>
    <rect x="760" y="270" width="210" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="775" y="290" font-size="11" font-weight="700" fill="#1e40af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">④ 提案中の人数</text>
    <text x="775" y="307" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5〜15人なら程よい競合</text>
    <text x="775" y="321" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">30人以上は激戦・避ける</text>
  </g>
  <line x1="755" y1="295" x2="395" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#ja-arrow)"/>

  <!-- ⑤ Manual annotation (top-center wide) -->
  <g>
    <rect x="40" y="400" width="220" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="55" y="420" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⑤ マニュアル提供あり</text>
    <text x="55" y="437" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">これがあれば仕様が明確で</text>
    <text x="55" y="451" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-2 の型がそのまま使える</text>
  </g>
  <line x1="260" y1="425" x2="445" y2="160" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ja-arrow)"/>

  <!-- ⑥ Description quality annotation -->
  <g>
    <rect x="760" y="400" width="220" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="775" y="420" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⑥ 仕様の具体度</text>
    <text x="775" y="437" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">何を取るか・どう納品か</text>
    <text x="775" y="451" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">が明記されてるか</text>
  </g>
  <line x1="755" y1="425" x2="555" y2="155" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ja-arrow)"/>

  <!-- Footer caption -->
  <text x="500" y="510" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">緑＝良いサイン｜黄＝チェック必要｜青＝戦略判断</text>
</svg>
