<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Claude Codeで案件001フォルダを開いた状態：チャットでフォルダの中身について質問するとClaudeが返事してくれる">
  <defs>
    <filter id="cf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="460" fill="#f3f4f6" rx="14"/>

  <!-- Window -->
  <g filter="url(#cf-shadow)">
    <rect x="40" y="30" width="640" height="400" rx="10" fill="#1f2937"/>
  </g>

  <!-- Title bar -->
  <rect x="40" y="30" width="640" height="32" rx="10" fill="#111827"/>
  <rect x="40" y="50" width="640" height="12" fill="#111827"/>
  <circle cx="60" cy="46" r="6" fill="#ef4444"/>
  <circle cx="80" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="46" r="6" fill="#22c55e"/>
  <text x="360" y="51" text-anchor="middle" font-size="11" font-weight="600" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Code — 案件001</text>

  <!-- Folder context pill (top) -->
  <rect x="60" y="80" width="160" height="28" rx="6" fill="#374151"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#e5e7eb" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📁 案件001 を開いています</text>

  <!-- User message -->
  <rect x="380" y="120" width="280" height="40" rx="10" fill="#3b82f6"/>
  <text x="520" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">このフォルダ、今は空っぽだよね？</text>

  <!-- Claude reply bubble -->
  <rect x="60" y="180" width="540" height="130" rx="10" fill="#374151"/>
  <circle cx="80" cy="205" r="12" fill="#ea580c"/>
  <text x="80" y="209" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C</text>
  <text x="100" y="209" font-size="11" font-weight="700" fill="#e5e7eb" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude</text>

  <text x="80" y="235" font-size="12" fill="#f3f4f6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">はい、案件001 フォルダの中を確認しました。</text>
  <text x="80" y="255" font-size="12" fill="#f3f4f6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">今のところ <tspan font-weight="700" fill="#fbbf24">ファイルは0件</tspan> です。空のフォルダ。</text>
  <text x="80" y="280" font-size="11" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">次の作業からマニュアルや結果ファイルがここに置かれていく予定ですね。</text>
  <text x="80" y="298" font-size="11" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">準備OKです、何から始めましょうか？</text>

  <!-- Annotation: this proves it works -->
  <rect x="460" y="320" width="200" height="32" rx="6" fill="#16a34a"/>
  <text x="560" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✅ フォルダを読めている証拠</text>

  <!-- Input box -->
  <rect x="60" y="370" width="540" height="40" rx="8" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="78" y="394" font-size="12" fill="#9ca3af" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">何か頼んでみよう...</text>
  <text x="585" y="394" text-anchor="end" font-size="14" fill="#9ca3af" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">↵</text>

  <!-- Caption -->
  <text x="360" y="450" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「📁 案件001 を開いています」が表示されてれば、Claudeがフォルダを認識できている状態</text>
</svg>
