<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="作るフォルダ構造のゴール：デスクトップ→テスト01→案件001">
  <defs>
    <filter id="card-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="240" fill="#f7f6f3" rx="14"/>

  <!-- 装飾 -->
  <text x="60" y="45" font-size="14" opacity="0.3" font-family="serif">✦</text>
  <text x="730" y="50" font-size="14" opacity="0.3" font-family="serif">✦</text>

  <!-- カード本体 -->
  <g filter="url(#card-shadow)">
    <rect x="180" y="40" width="440" height="170" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <!-- カードタイトル -->
  <text x="400" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">作るフォルダ構造（2階層だけ）</text>

  <!-- 🖥️ デスクトップ -->
  <text x="220" y="108" font-size="22">🖥️</text>
  <text x="252" y="115" font-size="15" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">デスクトップ</text>

  <!-- ツリーライン1 -->
  <line x1="232" y1="125" x2="232" y2="148" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="232" y1="148" x2="252" y2="148" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 📁 テスト01 -->
  <text x="252" y="155" font-size="20">📁</text>
  <text x="284" y="161" font-size="15" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">テスト01</text>

  <!-- ツリーライン2 -->
  <line x1="266" y1="170" x2="266" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="266" y1="190" x2="284" y2="190" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 📁 案件001 -->
  <text x="284" y="197" font-size="20">📁</text>
  <text x="316" y="203" font-size="15" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">案件001</text>

  <!-- 完成バッジ -->
  <g filter="url(#card-shadow)">
    <rect x="488" y="180" width="100" height="36" rx="18" fill="#10b981"/>
  </g>
  <text x="538" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 完成</text>
</svg>
