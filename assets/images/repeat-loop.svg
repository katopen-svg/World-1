<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="リピート発注の好循環：納品★5→継続提案メッセージ→リピート発注→単価UP→次の納品の繰り返しで副業が加速する">
  <defs>
    <filter id="rl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rl-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#d97706"/>
    </marker>
    <marker id="rl-arrow-loop" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#fffbeb" rx="14"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔄 リピート発注の好循環 — 副業が加速する仕組み</text>
  <text x="550" y="64" text-anchor="middle" font-size="12" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1件目の納品で、2件目・3件目・無限の発注を引き寄せる</text>

  <!-- Step 1: 納品★5 -->
  <g filter="url(#rl-shadow)">
    <circle cx="170" cy="220" r="65" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="170" y="216" text-anchor="middle" font-size="38" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐</text>
  <text x="170" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">納品★5</text>
  <text x="170" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">①  4-3 で習った3要素</text>
  <text x="170" y="322" text-anchor="middle" font-size="10" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">品質+カバー文+整ったファイル</text>

  <line x1="240" y1="220" x2="365" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#rl-arrow)"/>

  <!-- Step 2: 継続提案 -->
  <g filter="url(#rl-shadow)">
    <circle cx="440" cy="220" r="65" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="440" y="216" text-anchor="middle" font-size="38" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💬</text>
  <text x="440" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">継続提案</text>
  <text x="440" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">② 「次回もぜひ」の一言</text>
  <text x="440" y="322" text-anchor="middle" font-size="10" fill="#d97706" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">納品メッセージの最後に</text>

  <line x1="510" y1="220" x2="635" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#rl-arrow)"/>

  <!-- Step 3: リピート発注 -->
  <g filter="url(#rl-shadow)">
    <circle cx="710" cy="220" r="65" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <text x="710" y="216" text-anchor="middle" font-size="38" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁</text>
  <text x="710" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">リピート発注</text>
  <text x="710" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">③ 応募不要で仕事が入る</text>
  <text x="710" y="322" text-anchor="middle" font-size="10" fill="#2563eb" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">クライアントから直接依頼</text>

  <line x1="780" y1="220" x2="905" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#rl-arrow)"/>

  <!-- Step 4: 単価UP -->
  <g filter="url(#rl-shadow)">
    <circle cx="980" cy="220" r="68" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  </g>
  <text x="980" y="216" text-anchor="middle" font-size="38" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💰</text>
  <text x="980" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">単価UP</text>
  <text x="980" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">④ 1件目より高い金額</text>
  <text x="980" y="323" text-anchor="middle" font-size="10" fill="#d97706" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥1,500 → ¥2,500 → ¥3,000+</text>

  <!-- Loop arrow from 単価UP back to 納品★5 (curving below) -->
  <path d="M 980 290 Q 980 410 750 410 L 400 410 Q 170 410 170 290" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="6,4" marker-end="url(#rl-arrow-loop)"/>
  <text x="575" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⬆️ さらに ★5納品 → ループ加速</text>
  <text x="575" y="458" text-anchor="middle" font-size="11" fill="#15803d" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1人のクライアントから3〜5件続くと、月の応募負担が激減します</text>
</svg>
