<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Claude Codeのサインアップ画面：メールアドレス入力・認証コード入力・パスワード設定">
  <defs>
    <filter id="su-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="su-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#f3f4f6" rx="14"/>

  <!-- App window -->
  <g filter="url(#su-shadow)">
    <rect x="100" y="30" width="500" height="400" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <rect x="100" y="30" width="500" height="32" rx="10" fill="#f9fafb"/>
  <rect x="100" y="52" width="500" height="10" fill="#f9fafb"/>
  <circle cx="118" cy="46" r="5" fill="#ef4444"/>
  <circle cx="134" cy="46" r="5" fill="#f59e0b"/>
  <circle cx="150" cy="46" r="5" fill="#22c55e"/>
  <text x="350" y="51" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Code</text>

  <!-- Logo -->
  <circle cx="350" cy="96" r="20" fill="#ea580c"/>
  <text x="350" y="103" text-anchor="middle" font-size="20" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C</text>

  <!-- Heading -->
  <text x="350" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Create your account</text>
  <text x="350" y="162" text-anchor="middle" font-size="11" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">アカウントを作って Claude Code を使い始めましょう</text>

  <!-- Email field -->
  <text x="160" y="195" font-size="11" font-weight="600" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">メールアドレス</text>
  <rect x="160" y="202" width="380" height="36" rx="6" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="172" y="225" font-size="12" fill="#1f2937" font-family="system-ui, -apple-system, monospace">your-email@example.com</text>

  <!-- Verification code field -->
  <text x="160" y="262" font-size="11" font-weight="600" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">認証コード（メールに届いた6桁）</text>
  <rect x="160" y="269" width="180" height="36" rx="6" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="172" y="292" font-size="14" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, monospace">123456</text>

  <!-- Resend link -->
  <text x="430" y="290" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">コードを再送する</text>

  <!-- Password field -->
  <text x="160" y="329" font-size="11" font-weight="600" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">パスワード（8文字以上）</text>
  <rect x="160" y="336" width="380" height="36" rx="6" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="172" y="359" font-size="14" fill="#1f2937" font-family="system-ui, -apple-system, monospace">••••••••••••</text>

  <!-- Submit button (annotated) -->
  <g filter="url(#su-shadow)">
    <rect x="160" y="385" width="380" height="38" rx="8" fill="#1f2937"/>
  </g>
  <text x="350" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Sign up</text>

  <!-- Annotation arrow pointing to Sign up -->
  <line x1="630" y1="400" x2="555" y2="404" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#su-arrow)"/>
  <text x="640" y="395" font-size="11" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">押す</text>

  <!-- Caption -->
  <text x="350" y="450" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">メアド入力 → コード入力 → パスワード → Sign up を押すだけ</text>
</svg>
