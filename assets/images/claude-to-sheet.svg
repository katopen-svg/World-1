<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Claude Code が調べた結果が、自動でスプレッドシートに書き込まれていく">
  <defs>
    <radialGradient id="cc-orange-3" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <filter id="soft-3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="240" fill="#f7f6f3" rx="14"/>

  <!-- 装飾 -->
  <text x="50" y="38" font-size="14" opacity="0.3" font-family="serif">✦</text>
  <text x="730" y="50" font-size="14" opacity="0.3" font-family="serif">✦</text>
  <text x="200" y="220" font-size="12" opacity="0.25" font-family="serif">✦</text>

  <!-- ━━━ Claude Code ━━━ -->
  <g filter="url(#soft-3)">
    <circle cx="90" cy="120" r="42" fill="url(#cc-orange-3)"/>
  </g>
  <text x="90" y="130" text-anchor="middle" font-size="30">💻</text>
  <text x="90" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Code</text>

  <!-- ━━━ 矢印 ━━━ -->
  <line x1="138" y1="120" x2="218" y2="120" stroke="#10b981" stroke-width="2" stroke-dasharray="3 4"/>
  <polygon points="218,120 210,115 210,125" fill="#10b981"/>
  <text x="178" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">自動で書き込み</text>
  <text x="178" y="142" text-anchor="middle" font-size="13" opacity="0.6">✨</text>

  <!-- ━━━ スプレッドシート ━━━ -->
  <g filter="url(#soft-3)">
    <rect x="240" y="40" width="520" height="160" rx="8" fill="white" stroke="#86efac" stroke-width="2"/>
  </g>

  <!-- ファイル名ヘッダー -->
  <rect x="240" y="40" width="520" height="28" rx="6" fill="#dcfce7"/>
  <text x="258" y="59" font-size="11" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📊 商品リスト.gsheet</text>

  <!-- 列ヘッダー -->
  <rect x="240" y="68" width="520" height="28" fill="#f0fdf4"/>
  <text x="262" y="86" font-size="11" font-weight="700" fill="#064e3b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">商品名</text>
  <text x="402" y="86" font-size="11" font-weight="700" fill="#064e3b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">URL</text>
  <text x="528" y="86" font-size="11" font-weight="700" fill="#064e3b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">価格</text>
  <text x="612" y="86" font-size="11" font-weight="700" fill="#064e3b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">評価</text>
  <text x="688" y="86" font-size="11" font-weight="700" fill="#064e3b" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">レビュー</text>

  <!-- 縦線 -->
  <line x1="390" y1="68" x2="390" y2="200" stroke="#bbf7d0"/>
  <line x1="514" y1="68" x2="514" y2="200" stroke="#bbf7d0"/>
  <line x1="600" y1="68" x2="600" y2="200" stroke="#bbf7d0"/>
  <line x1="676" y1="68" x2="676" y2="200" stroke="#bbf7d0"/>

  <!-- データ行 -->
  <rect x="240" y="96" width="520" height="26" fill="white"/>
  <text x="262" y="113" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">A家電 X-100</text>
  <text x="402" y="113" font-size="11" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif">link...</text>
  <text x="528" y="113" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">¥12,800</text>
  <text x="612" y="113" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">★4.5</text>
  <text x="688" y="113" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">348</text>

  <rect x="240" y="122" width="520" height="26" fill="#fafffe"/>
  <text x="262" y="139" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">B家電 Pro</text>
  <text x="402" y="139" font-size="11" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif">link...</text>
  <text x="528" y="139" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">¥24,500</text>
  <text x="612" y="139" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">★4.7</text>
  <text x="688" y="139" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">512</text>

  <rect x="240" y="148" width="520" height="26" fill="white"/>
  <text x="262" y="165" font-size="11" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">C家電 Air</text>
  <text x="402" y="165" font-size="11" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif">link...</text>
  <text x="528" y="165" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">¥8,900</text>
  <text x="612" y="165" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">★4.2</text>
  <text x="688" y="165" font-size="11" fill="#374151" font-family="system-ui, -apple-system, sans-serif">156</text>

  <!-- 続き -->
  <rect x="240" y="174" width="520" height="26" fill="#fafffe"/>
  <text x="500" y="191" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">… 100件まで自動で追加</text>
</svg>
