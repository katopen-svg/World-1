<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="試すフェーズの会話例：マニュアルを読み込ませて、まず3件だけ試すまで">
  <defs>
    <radialGradient id="claude-orange-1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <filter id="bubble-shadow-1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="360" fill="#f7f6f3" rx="14"/>

  <!-- タイトル -->
  <text x="400" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">試すフェーズの会話イメージ</text>

  <!-- ━━━ 吹き出し1: あなた（マニュアル添付して依頼） ━━━ -->
  <g filter="url(#bubble-shadow-1)">
    <rect x="280" y="56" width="490" height="78" rx="22" fill="#3b82f6"/>
  </g>
  <!-- 添付ファイル風 -->
  <rect x="305" y="68" width="160" height="22" rx="4" fill="#1e40af"/>
  <text x="316" y="83" font-size="11" fill="white" font-family="system-ui, -apple-system, sans-serif">📎 manual.pdf</text>
  <text x="305" y="108" font-size="13" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">このマニュアル通りに楽天で200社</text>
  <text x="305" y="126" font-size="13" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">調べたい。まず3件だけ試して</text>

  <!-- ━━━ 吹き出し2: Claude（マニュアル読み込み確認） ━━━ -->
  <g filter="url(#bubble-shadow-1)">
    <circle cx="60" cy="180" r="22" fill="url(#claude-orange-1)"/>
  </g>
  <text x="60" y="189" text-anchor="middle" font-size="18">💻</text>

  <g filter="url(#bubble-shadow-1)">
    <rect x="92" y="155" width="450" height="64" rx="22" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  <text x="116" y="183" font-size="13" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">マニュアル読みました！</text>
  <text x="116" y="203" font-size="13" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">まず3件取ってきますね</text>

  <!-- ━━━ 吹き出し3: Claude（結果） ━━━ -->
  <g filter="url(#bubble-shadow-1)">
    <circle cx="60" cy="290" r="22" fill="url(#claude-orange-1)"/>
  </g>
  <text x="60" y="299" text-anchor="middle" font-size="18">💻</text>

  <g filter="url(#bubble-shadow-1)">
    <rect x="92" y="244" width="490" height="100" rx="20" fill="white" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="116" y="270" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✓ 3件取れました（方向OKですか？）</text>
  <text x="124" y="294" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・株式会社A（評価4.5）</text>
  <text x="124" y="313" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・株式会社B（評価4.7）</text>
  <text x="124" y="332" font-size="12" fill="#374151" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・株式会社C（評価4.2）</text>
</svg>
