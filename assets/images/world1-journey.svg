<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World1 ステージマップ：5つのステージを順番にクリアして月5万を目指す">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="200" fill="url(#bg)" rx="16"/>

  <!-- 装飾の sparkle -->
  <text x="60" y="40" font-size="18" opacity="0.35" font-family="serif">✦</text>
  <text x="730" y="55" font-size="14" opacity="0.3" font-family="serif">✦</text>
  <text x="160" y="180" font-size="12" opacity="0.25" font-family="serif">✦</text>
  <text x="600" y="175" font-size="14" opacity="0.3" font-family="serif">✦</text>

  <!-- ステージをつなぐ点線パス -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#d97706" stroke-width="3" stroke-dasharray="5 7" stroke-linecap="round" opacity="0.6"/>

  <!-- START バッジ -->
  <g filter="url(#soft)">
    <rect x="50" y="80" width="50" height="40" rx="20" fill="#1f2937"/>
    <text x="75" y="105" text-anchor="middle" fill="white" font-size="13" font-weight="700" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">START</text>
  </g>

  <!-- ステージ 1: w1-1 道具 -->
  <g filter="url(#soft)">
    <circle cx="180" cy="100" r="24" fill="#10b981"/>
    <text x="180" y="106" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1</text>
  </g>
  <text x="180" y="150" text-anchor="middle" fill="#4b5563" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">道具</text>

  <!-- ステージ 2: w1-2 型 -->
  <g filter="url(#soft)">
    <circle cx="290" cy="100" r="24" fill="#3b82f6"/>
    <text x="290" y="106" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2</text>
  </g>
  <text x="290" y="150" text-anchor="middle" fill="#4b5563" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">型</text>

  <!-- ステージ 3: w1-3 応募 -->
  <g filter="url(#soft)">
    <circle cx="400" cy="100" r="24" fill="#8b5cf6"/>
    <text x="400" y="106" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">3</text>
  </g>
  <text x="400" y="150" text-anchor="middle" fill="#4b5563" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">応募</text>

  <!-- ステージ 4: w1-4 納品 -->
  <g filter="url(#soft)">
    <circle cx="510" cy="100" r="24" fill="#ec4899"/>
    <text x="510" y="106" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">4</text>
  </g>
  <text x="510" y="150" text-anchor="middle" fill="#4b5563" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">納品</text>

  <!-- ステージ 5: w1-5 継続 -->
  <g filter="url(#soft)">
    <circle cx="620" cy="100" r="24" fill="#ef4444"/>
    <text x="620" y="106" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">5</text>
  </g>
  <text x="620" y="150" text-anchor="middle" fill="#4b5563" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">継続</text>

  <!-- ゴール: 月5万 -->
  <g filter="url(#soft)">
    <circle cx="720" cy="100" r="30" fill="#fbbf24"/>
    <text x="720" y="110" text-anchor="middle" font-size="28">🏆</text>
  </g>
  <text x="720" y="160" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月5万</text>
</svg>
