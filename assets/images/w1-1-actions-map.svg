<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="w1-1で学ぶ4つのアクション。合計約25分でcheckpointに到達">
  <defs>
    <filter id="soft-map" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="220" fill="#f7f6f3" rx="14"/>

  <!-- タイトル -->
  <text x="400" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">w1-1 で学ぶ4つのアクション ｜ 合計 約25分</text>

  <!-- パス（点線） -->
  <line x1="100" y1="115" x2="700" y2="115" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- ① Claude Codeの役割 -->
  <g filter="url(#soft-map)">
    <circle cx="140" cy="115" r="26" fill="#3b82f6"/>
  </g>
  <text x="140" y="122" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Claude Code</text>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">の役割</text>
  <text x="140" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏱ 5分</text>

  <!-- ② スプレッドシートの役割 -->
  <g filter="url(#soft-map)">
    <circle cx="290" cy="115" r="26" fill="#10b981"/>
  </g>
  <text x="290" y="122" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2</text>
  <text x="290" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">スプレッドシート</text>
  <text x="290" y="176" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">の役割</text>
  <text x="290" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏱ 5分</text>

  <!-- ③ 作業フォルダの作り方 -->
  <g filter="url(#soft-map)">
    <circle cx="440" cy="115" r="26" fill="#8b5cf6"/>
  </g>
  <text x="440" y="122" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">3</text>
  <text x="440" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">作業フォルダ</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">の作り方</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏱ 10分</text>

  <!-- ④ 役割を1枚で整理 -->
  <g filter="url(#soft-map)">
    <circle cx="590" cy="115" r="26" fill="#ec4899"/>
  </g>
  <text x="590" y="122" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">4</text>
  <text x="590" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">役割を</text>
  <text x="590" y="176" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1枚で整理</text>
  <text x="590" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⏱ 5分</text>

  <!-- CHECKPOINT バッジ -->
  <g filter="url(#soft-map)">
    <rect x="685" y="92" width="90" height="46" rx="23" fill="#1f2937"/>
  </g>
  <text x="730" y="110" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CHECK</text>
  <text x="730" y="126" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">POINT</text>
  <text x="730" y="160" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">役割を説明</text>
  <text x="730" y="176" text-anchor="middle" font-size="11" fill="#4b5563" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">できる</text>
</svg>
