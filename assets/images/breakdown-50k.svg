<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="月5万円を作る3パターン：新規重視・バランス・リピート重視で、それぞれ件数×単価で50000円に到達するルートを比較">
  <defs>
    <filter id="bd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#fffbeb" rx="14"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💴 月5万を作る3つのパターン — 件数×単価のミックス</text>
  <text x="600" y="64" text-anchor="middle" font-size="12" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月5万 = リピート + 新規 のミックス。月数が経つほど「リピート寄り」に進化していく</text>

  <!-- ============== Pattern A: 新規重視（1ヶ月目） ============== -->

  <g filter="url(#bd-shadow)">
    <rect x="40" y="100" width="360" height="380" rx="14" fill="white" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <rect x="40" y="100" width="360" height="50" rx="14" fill="#dbeafe"/>
  <rect x="40" y="125" width="360" height="25" fill="#dbeafe"/>
  <text x="220" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">パターンA｜新規重視</text>
  <text x="220" y="148" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1〜2ヶ月目（リピート少なめ）</text>

  <text x="220" y="195" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📝</text>

  <text x="60" y="240" font-size="12" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁 リピート</text>
  <text x="60" y="262" font-size="11" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3件 × ¥1,500 = ¥4,500</text>

  <text x="60" y="296" font-size="12" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🆕 新規</text>
  <text x="60" y="318" font-size="11" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">18件 × ¥2,500 = ¥45,000</text>

  <line x1="60" y1="340" x2="380" y2="340" stroke="#3b82f6" stroke-width="2"/>

  <text x="60" y="368" font-size="13" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月合計</text>
  <text x="380" y="368" text-anchor="end" font-size="20" font-weight="700" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥49,500</text>

  <!-- Caveats -->
  <rect x="60" y="390" width="320" height="76" rx="6" fill="#eff6ff"/>
  <text x="75" y="410" font-size="11" font-weight="700" fill="#1e3a8a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💪 特徴</text>
  <text x="75" y="428" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・応募活動が多い（月90件くらい）</text>
  <text x="75" y="444" font-size="10" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・採用率20%なら週4-5件採用が必要</text>
  <text x="75" y="460" font-size="10" fill="#dc2626" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・体力勝負、続けるとキツい</text>

  <!-- ============== Pattern B: バランス（2ヶ月目） ============== -->

  <g filter="url(#bd-shadow)">
    <rect x="420" y="100" width="360" height="380" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  </g>
  <rect x="420" y="100" width="360" height="50" rx="14" fill="#bbf7d0"/>
  <rect x="420" y="125" width="360" height="25" fill="#bbf7d0"/>
  <text x="600" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐ パターンB｜バランス</text>
  <text x="600" y="148" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">2〜3ヶ月目（バランス型・推奨）</text>

  <text x="600" y="195" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⚖️</text>

  <text x="440" y="240" font-size="12" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁 リピート</text>
  <text x="440" y="262" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">7件 × ¥2,500 = ¥17,500</text>

  <text x="440" y="296" font-size="12" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🆕 新規</text>
  <text x="440" y="318" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">11件 × ¥3,000 = ¥33,000</text>

  <line x1="440" y1="340" x2="760" y2="340" stroke="#22c55e" stroke-width="2"/>

  <text x="440" y="368" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月合計</text>
  <text x="760" y="368" text-anchor="end" font-size="20" font-weight="700" fill="#16a34a" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥50,500</text>

  <!-- Caveats -->
  <rect x="440" y="390" width="320" height="76" rx="6" fill="#f0fdf4"/>
  <text x="455" y="410" font-size="11" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💪 特徴</text>
  <text x="455" y="428" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・応募活動は月55件くらいで済む</text>
  <text x="455" y="444" font-size="10" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・リピートで時間効率が上がる</text>
  <text x="455" y="460" font-size="10" fill="#16a34a" font-weight="700" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・継続可能なペース</text>

  <!-- ============== Pattern C: リピート重視（3ヶ月目以降） ============== -->

  <g filter="url(#bd-shadow)">
    <rect x="800" y="100" width="360" height="380" rx="14" fill="white" stroke="#d97706" stroke-width="3"/>
  </g>
  <rect x="800" y="100" width="360" height="50" rx="14" fill="#fef3c7"/>
  <rect x="800" y="125" width="360" height="25" fill="#fef3c7"/>
  <text x="980" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">パターンC｜リピート重視</text>
  <text x="980" y="148" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3ヶ月目以降（プロ寄り）</text>

  <text x="980" y="195" text-anchor="middle" font-size="44" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁</text>

  <text x="820" y="240" font-size="12" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🔁 リピート</text>
  <text x="820" y="262" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">12件 × ¥3,000 = ¥36,000</text>

  <text x="820" y="296" font-size="12" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">🆕 新規</text>
  <text x="820" y="318" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5件 × ¥2,800 = ¥14,000</text>

  <line x1="820" y1="340" x2="1140" y2="340" stroke="#d97706" stroke-width="2"/>

  <text x="820" y="368" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月合計</text>
  <text x="1140" y="368" text-anchor="end" font-size="20" font-weight="700" fill="#d97706" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">¥50,000</text>

  <!-- Caveats -->
  <rect x="820" y="390" width="320" height="76" rx="6" fill="#fffbeb"/>
  <text x="835" y="410" font-size="11" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">💪 特徴</text>
  <text x="835" y="428" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・応募活動は月25件くらいで済む</text>
  <text x="835" y="444" font-size="10" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・1日30分程度の運用でOK</text>
  <text x="835" y="460" font-size="10" fill="#d97706" font-weight="700" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">・月10万も射程に入る</text>

  <!-- Bottom -->
  <text x="600" y="500" text-anchor="middle" font-size="12" fill="#9a3412" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">最初は A → 慣れたら B → 安定したら C へ進化していく</text>
</svg>
