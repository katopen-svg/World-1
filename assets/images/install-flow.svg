<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Claude Codeを使えるようにする5ステップ：ダウンロード → インストール → アカウント作成 → Pro登録 → ログイン">
  <defs>
    <filter id="step-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#fffbeb" rx="14"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📥 Claude Codeを使えるようにする5ステップ</text>

  <!-- ============== ROW 1 (Steps 1-3) ============== -->

  <!-- Step 1: ダウンロード -->
  <g filter="url(#step-shadow)">
    <rect x="60" y="80" width="220" height="160" rx="12" fill="white" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <circle cx="92" cy="112" r="16" fill="#ea580c"/>
  <text x="92" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">1</text>
  <text x="120" y="118" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">ダウンロード</text>
  <text x="170" y="170" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⬇️</text>
  <text x="170" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">claude.ai/download</text>
  <text x="170" y="223" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Mac/Windows 自動判定</text>

  <!-- Arrow: 1 → 2 -->
  <line x1="285" y1="160" x2="320" y2="160" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: インストール -->
  <g filter="url(#step-shadow)">
    <rect x="325" y="80" width="220" height="160" rx="12" fill="white" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <circle cx="357" cy="112" r="16" fill="#ea580c"/>
  <text x="357" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">2</text>
  <text x="385" y="118" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">インストール</text>
  <text x="435" y="170" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📦</text>
  <text x="435" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">ダブルクリック</text>
  <text x="435" y="223" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">指示通り「次へ」</text>

  <!-- Arrow: 2 → 3 -->
  <line x1="550" y1="160" x2="585" y2="160" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: アカウント作成 -->
  <g filter="url(#step-shadow)">
    <rect x="590" y="80" width="220" height="160" rx="12" fill="white" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <circle cx="622" cy="112" r="16" fill="#ea580c"/>
  <text x="622" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3</text>
  <text x="650" y="118" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">アカウント作成</text>
  <text x="700" y="170" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">📧</text>
  <text x="700" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">メアド + 認証コード</text>
  <text x="700" y="223" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">3〜5分で完了</text>

  <!-- Curved arrow: ③ bottom → ④ top -->
  <path d="M 700 240 L 700 250 Q 700 260 690 260 L 315 260 Q 305 260 305 270 L 305 275" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============== ROW 2 (Steps 4-5, centered) ============== -->

  <!-- Step 4: Pro登録（強調） -->
  <g filter="url(#step-shadow)">
    <rect x="195" y="280" width="220" height="160" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <circle cx="227" cy="312" r="16" fill="#d97706"/>
  <text x="227" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">4</text>
  <text x="255" y="318" font-size="14" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">Pro登録</text>
  <text x="305" y="370" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">⭐</text>
  <text x="305" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">月20ドル</text>
  <text x="305" y="423" text-anchor="middle" font-size="11" fill="#9a3412" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">いつでもキャンセル可</text>

  <!-- Arrow: 4 → 5 -->
  <line x1="420" y1="360" x2="455" y2="360" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: ログイン -->
  <g filter="url(#step-shadow)">
    <rect x="460" y="280" width="220" height="160" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <circle cx="492" cy="312" r="16" fill="#16a34a"/>
  <text x="492" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="white" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">5</text>
  <text x="520" y="318" font-size="14" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">ログイン &amp; 動作確認</text>
  <text x="570" y="370" text-anchor="middle" font-size="40" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">✅</text>
  <text x="570" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">「こんにちは」</text>
  <text x="570" y="423" text-anchor="middle" font-size="11" fill="#15803d" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">→返事が来たらクリア</text>

  <!-- Footer caption -->
  <text x="450" y="465" text-anchor="middle" font-size="12" fill="#9a3412" font-style="italic" font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif">所要時間：合計15〜20分（カードを手元に用意してから始めるとスムーズ）</text>
</svg>
